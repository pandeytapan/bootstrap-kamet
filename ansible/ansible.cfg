# Ansible configuration for this repository
# This overrides /opt/devtools/etc/ansible/ansible.cfg when running from this directory

[defaults]
inventory = inventory/hosts.ini
roles_path = roles:/opt/devtools/share/ansible/roles
collections_path = /opt/devtools/share/ansible/collections
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
interpreter_python = auto_silent

# Useful for debugging
# verbosity = 1

[privilege_escalation]
become = False
become_method = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
control_path = /tmp/ansible-%%h-%%p-%%r
