# Ansible Inventory
# Organize your hosts here

[local]
localhost ansible_connection=local

[dev]
# Development machines
# dev-machine ansible_host=192.168.1.10 ansible_user=tapan

[staging]
# Staging servers
# staging-1 ansible_host=10.0.0.10

[production]
# Production servers (be careful!)
# prod-1 ansible_host=10.0.1.10

# Group variables
[dev:vars]
env=development

[staging:vars]
env=staging

[production:vars]
env=production
ansible_become=yes
