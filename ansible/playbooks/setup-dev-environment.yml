---
# Development Environment Setup Playbook
# Run: ansible-playbook playbooks/setup-dev-environment.yml
#
# Customize the variables below for your needs

- name: Setup Development Environment
  hosts: localhost
  connection: local
  become: yes

  vars:
    # Toggle which tools to install
    install_build_tools: true
    install_python_tools: true
    install_cpp_tools: true
    install_docker: false
    install_nodejs: false

    # Python packages to install globally
    python_packages:
      - ipython
      - black
      - ruff
      - mypy
      - pytest

    # C++ tools
    cpp_packages:
      - build-essential
      - cmake
      - ninja-build
      - ccache
      - clang
      - clang-format
      - clang-tidy
      - gdb
      - valgrind

  tasks:
    # ========================================
    # Build Essentials
    # ========================================
    - name: Install build essentials
      when: install_build_tools
      ansible.builtin.apt:
        name:
          - build-essential
          - git
          - curl
          - wget
          - unzip
          - jq
          - tree
          - htop
        state: present
        update_cache: yes

    # ========================================
    # Python Development
    # ========================================
    - name: Install Python development packages
      when: install_python_tools
      ansible.builtin.apt:
        name:
          - python3-dev
          - python3-pip
          - python3-venv
        state: present

    - name: Install Python tools via pip
      when: install_python_tools
      ansible.builtin.pip:
        name: "{{ python_packages }}"
        state: present
        extra_args: --break-system-packages

    # ========================================
    # C++ Development
    # ========================================
    - name: Install C++ development packages
      when: install_cpp_tools
      ansible.builtin.apt:
        name: "{{ cpp_packages }}"
        state: present

    # ========================================
    # Docker (Optional)
    # ========================================
    - name: Install Docker prerequisites
      when: install_docker
      ansible.builtin.apt:
        name:
          - ca-certificates
          - gnupg
          - lsb-release
        state: present

    - name: Add Docker GPG key
      when: install_docker
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      when: install_docker
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker
      when: install_docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    # ========================================
    # Node.js (Optional)
    # ========================================
    - name: Install Node.js via NodeSource
      when: install_nodejs
      block:
        - name: Download NodeSource setup script
          ansible.builtin.get_url:
            url: https://deb.nodesource.com/setup_20.x
            dest: /tmp/nodesource_setup.sh
            mode: '0755'

        - name: Run NodeSource setup
          ansible.builtin.command: /tmp/nodesource_setup.sh
          args:
            creates: /etc/apt/sources.list.d/nodesource.list

        - name: Install Node.js
          ansible.builtin.apt:
            name: nodejs
            state: present
            update_cache: yes

    # ========================================
    # Summary
    # ========================================
    - name: Display summary
      ansible.builtin.debug:
        msg:
          - "Development environment setup complete!"
          - "Build tools: {{ 'installed' if install_build_tools else 'skipped' }}"
          - "Python tools: {{ 'installed' if install_python_tools else 'skipped' }}"
          - "C++ tools: {{ 'installed' if install_cpp_tools else 'skipped' }}"
          - "Docker: {{ 'installed' if install_docker else 'skipped' }}"
          - "Node.js: {{ 'installed' if install_nodejs else 'skipped' }}"
