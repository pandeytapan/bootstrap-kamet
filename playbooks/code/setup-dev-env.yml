---
#
# Development Environment Setup Playbook
# Installs common tools for Python and C++ development
#
# Usage: 
#   ansible-playbook code.books/setup-dev-env.yml           # Dry run (check mode)
#   ansible-playbook code.books/setup-dev-env.yml -e install=true  # Actually install
#
# Options:
#   -e install=true              Actually install packages
#   -e install_docker=true       Also install Docker
#   -e install_rust=true         Also install Rust toolchain
#

- name: Setup Development Environment
  hosts: localhost
  connection: local
  gather_facts: yes

  vars:
    # Set to true to actually install (default is check-only)
    install: false
    
    # Optional components (disabled by default)
    install_docker: false
    install_rust: false
    install_nodejs: false
    
    # Installation directory for custom tools
    devtools_bin: "/opt/devtools/bin"
    devtools_src: "/opt/devtools/src"

  tasks:
    # ══════════════════════════════════════════
    # HEADER
    # ══════════════════════════════════════════
    - name: Print header
      ansible.builtin.shell: |
        echo -e "\n\e[1m\e[0;36m══════════════════════════════════════════\e[0m"
        echo -e "\e[1m\e[0;36m  Development Environment Setup\e[0m"
        echo -e "\e[1m\e[0;36m══════════════════════════════════════════\e[0m\n"
        if [ "{{ install }}" = "false" ]; then
          echo -e "\e[1;33m[!] CHECK MODE - No changes will be made\e[0m"
          echo -e "\e[1;33m    Run with: -e install=true to apply\e[0m\n"
        else
          echo -e "\e[1;32m[!] INSTALL MODE - Packages will be installed\e[0m\n"
        fi
      args:
        executable: /bin/bash
      changed_when: false

    # ══════════════════════════════════════════
    # STEP 1: SYSTEM ESSENTIALS
    # ══════════════════════════════════════════
    - name: Step 1 - System essentials
      ansible.builtin.shell: |
        echo -e "\e[0;34m[→]\e[0m \e[1mSTEP 1/8:\e[0m Installing system essentials..."
      args:
        executable: /bin/bash
      changed_when: false

    - name: Install essential system packages
      become: yes
      ansible.builtin.apt:
        name:
          # Build essentials
          - build-essential
          - pkg-config
          - autoconf
          - automake
          - libtool
          # Version control
          - git
          - git-lfs
          # Utilities
          - curl
          - wget
          - unzip
          - zip
          - tar
          - gzip
          - jq
          - tree
          - htop
          - ncdu
          - tmux
          - screen
          # Network tools
          - net-tools
          - openssh-client
          # Text processing
          - ripgrep
          - fd-find
          - silversearcher-ag
        state: present
        update_cache: yes
      when: install | bool

    - name: Report system essentials
      ansible.builtin.shell: |
        echo -e "\e[0;32m[✓]\e[0m System essentials: build-essential, git, curl, wget, htop, tmux, ripgrep..."
      args:
        executable: /bin/bash
      changed_when: false

    # ══════════════════════════════════════════
    # STEP 2: C++ DEVELOPMENT
    # ══════════════════════════════════════════
    - name: Step 2 - C++ development tools
      ansible.builtin.shell: |
        echo -e "\e[0;34m[→]\e[0m \e[1mSTEP 2/8:\e[0m Installing C++ development tools..."
      args:
        executable: /bin/bash
      changed_when: false

    - name: Install C++ compilers and tools
      become: yes
      ansible.builtin.apt:
        name:
          # Compilers
          - gcc
          - g++
          - clang
          - clang-format
          - clang-tidy
          - clangd
          # Build systems
          - cmake
          - ninja-build
          - meson
          # Debugging & profiling
          - gdb
          - valgrind
          - strace
          - ltrace
          # Static analysis
          - cppcheck
          # Libraries
          - libboost-all-dev
          - libeigen3-dev
          - libgtest-dev
          - libbenchmark-dev
          # Documentation
          - doxygen
          - graphviz
        state: present
      when: install | bool

    - name: Install ccache for faster builds
      become: yes
      ansible.builtin.apt:
        name: ccache
        state: present
      when: install | bool

    - name: Report C++ tools
      ansible.builtin.shell: |
        echo -e "\e[0;32m[✓]\e[0m C++ tools: gcc, g++, clang, cmake, ninja, gdb, valgrind, boost, eigen..."
      args:
        executable: /bin/bash
      changed_when: false

    # ══════════════════════════════════════════
    # STEP 3: PYTHON DEVELOPMENT
    # ══════════════════════════════════════════
    - name: Step 3 - Python development tools
      ansible.builtin.shell: |
        echo -e "\e[0;34m[→]\e[0m \e[1mSTEP 3/8:\e[0m Installing Python development tools..."
      args:
        executable: /bin/bash
      changed_when: false

    - name: Install Python system packages
      become: yes
      ansible.builtin.apt:
        name:
          - python3
          - python3-dev
          - python3-pip
          - python3-venv
          - python3-wheel
          - python3-setuptools
          # For building Python packages with C extensions
          - libffi-dev
          - libssl-dev
          - libbz2-dev
          - libreadline-dev
          - libsqlite3-dev
          - zlib1g-dev
          - liblzma-dev
        state: present
      when: install | bool

    - name: Install Python dev tools via pip
      ansible.builtin.pip:
        name:
          # Linting & formatting
          - ruff
          - black
          - isort
          - mypy
          # Testing
          - pytest
          - pytest-cov
          - pytest-xdist
          # REPL & debugging
          - ipython
          - ipdb
          - rich
          # Documentation
          - sphinx
          - mkdocs
          # Build tools
          - build
          - twine
          # Utilities
          - pipx
          - pre-commit
        state: present
        extra_args: --user --break-system-packages
      when: install | bool

    - name: Report Python tools
      ansible.builtin.shell: |
        echo -e "\e[0;32m[✓]\e[0m Python tools: python3, pip, venv, ruff, black, mypy, pytest, ipython..."
      args:
        executable: /bin/bash
      changed_when: false

    # ══════════════════════════════════════════
    # STEP 4: ML/AI LIBRARIES (Python)
    # ══════════════════════════════════════════
    - name: Step 4 - ML/AI libraries
      ansible.builtin.shell: |
        echo -e "\e[0;34m[→]\e[0m \e[1mSTEP 4/8:\e[0m Installing ML/AI libraries..."
      args:
        executable: /bin/bash
      changed_when: false

    - name: Install ML/AI Python packages
      ansible.builtin.pip:
        name:
          # Core scientific stack
          - numpy
          - scipy
          - pandas
          - matplotlib
          - seaborn
          # ML libraries
          - scikit-learn
          - xgboost
          - lightgbm
          # Deep learning (CPU versions - GPU needs manual setup)
          - torch --index-url https://download.pytorch.org/whl/cpu
          - torchvision --index-url https://download.pytorch.org/whl/cpu
          # Jupyter
          - jupyter
          - jupyterlab
          - notebook
          # Utilities
          - tqdm
          - pyyaml
          - python-dotenv
        state: present
        extra_args: --user --break-system-packages
      when: install | bool

    - name: Report ML/AI libraries
      ansible.builtin.shell: |
        echo -e "\e[0;32m[✓]\e[0m ML/AI: numpy, scipy, pandas, scikit-learn, pytorch (CPU), jupyter..."
        echo -e "\e[1;33m    Note: For GPU PyTorch, install manually with CUDA support\e[0m"
      args:
        executable: /bin/bash
      changed_when: false

    # ══════════════════════════════════════════
    # STEP 5: VERSION MANAGERS
    # ══════════════════════════════════════════
    - name: Step 5 - Version managers
      ansible.builtin.shell: |
        echo -e "\e[0;34m[→]\e[0m \e[1mSTEP 5/8:\e[0m Installing version managers..."
      args:
        executable: /bin/bash
      changed_when: false

    - name: Install pyenv dependencies
      become: yes
      ansible.builtin.apt:
        name:
          - libffi-dev
          - libssl-dev
          - libbz2-dev
          - libreadline-dev
          - libsqlite3-dev
          - libncursesw5-dev
          - xz-utils
          - tk-dev
          - libxml2-dev
          - libxmlsec1-dev
          - liblzma-dev
        state: present
      when: install | bool

    - name: Check if pyenv is installed
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.pyenv"
      register: pyenv_installed

    - name: Install pyenv
      ansible.builtin.shell: |
        curl https://pyenv.run | bash
      args:
        executable: /bin/bash
      when: 
        - install | bool
        - not pyenv_installed.stat.exists

    - name: Report version managers
      ansible.builtin.shell: |
        echo -e "\e[0;32m[✓]\e[0m Version managers: pyenv (for Python version management)"
      args:
        executable: /bin/bash
      changed_when: false

    # ══════════════════════════════════════════
    # STEP 6: EDITORS & IDE SUPPORT
    # ══════════════════════════════════════════
    - name: Step 6 - Editors and IDE support
      ansible.builtin.shell: |
        echo -e "\e[0;34m[→]\e[0m \e[1mSTEP 6/8:\e[0m Installing editors and LSP support..."
      args:
        executable: /bin/bash
      changed_when: false

    - name: Install editors and LSP tools
      become: yes
      ansible.builtin.apt:
        name:
          # Editors
          - vim
          - neovim
          # LSP servers (for IDE features)
          - clangd
          # Terminal multiplexer
          - tmux
        state: present
      when: install | bool

    - name: Install Python LSP via pip
      ansible.builtin.pip:
        name:
          - python-lsp-server
          - pylsp-mypy
        state: present
        extra_args: --user --break-system-packages
      when: install | bool

    - name: Report editors
      ansible.builtin.shell: |
        echo -e "\e[0;32m[✓]\e[0m Editors: vim, neovim, clangd (LSP), python-lsp-server"
        echo -e "\e[1;33m    Tip: Install VS Code separately from https://code.visualstudio.com\e[0m"
      args:
        executable: /bin/bash
      changed_when: false

    # ══════════════════════════════════════════
    # STEP 7: OPTIONAL - DOCKER
    # ══════════════════════════════════════════
    - name: Step 7 - Docker (optional)
      ansible.builtin.shell: |
        if [ "{{ install_docker }}" = "true" ]; then
          echo -e "\e[0;34m[→]\e[0m \e[1mSTEP 7/8:\e[0m Installing Docker..."
        else
          echo -e "\e[0;34m[→]\e[0m \e[1mSTEP 7/8:\e[0m Skipping Docker (use -e install_docker=true to enable)"
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Install Docker prerequisites
      become: yes
      ansible.builtin.apt:
        name:
          - ca-certificates
          - gnupg
          - lsb-release
        state: present
      when: 
        - install | bool
        - install_docker | bool

    - name: Add Docker GPG key
      become: yes
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
      when: 
        - install | bool
        - install_docker | bool

    - name: Add Docker repository
      become: yes
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
      when: 
        - install | bool
        - install_docker | bool

    - name: Install Docker
      become: yes
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes
      when: 
        - install | bool
        - install_docker | bool

    - name: Add user to docker group
      become: yes
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        groups: docker
        append: yes
      when: 
        - install | bool
        - install_docker | bool

    - name: Report Docker status
      ansible.builtin.shell: |
        if [ "{{ install_docker }}" = "true" ]; then
          echo -e "\e[0;32m[✓]\e[0m Docker: docker-ce, docker-compose installed"
          echo -e "\e[1;33m    Note: Log out and back in for docker group to take effect\e[0m"
        else
          echo -e "\e[1;33m[!]\e[0m Docker: Skipped"
        fi
      args:
        executable: /bin/bash
      changed_when: false

    # ══════════════════════════════════════════
    # STEP 8: OPTIONAL - RUST
    # ══════════════════════════════════════════
    - name: Step 8 - Rust (optional)
      ansible.builtin.shell: |
        if [ "{{ install_rust }}" = "true" ]; then
          echo -e "\e[0;34m[→]\e[0m \e[1mSTEP 8/8:\e[0m Installing Rust toolchain..."
        else
          echo -e "\e[0;34m[→]\e[0m \e[1mSTEP 8/8:\e[0m Skipping Rust (use -e install_rust=true to enable)"
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Check if Rust is installed
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.cargo/bin/rustc"
      register: rust_installed

    - name: Install Rust via rustup
      ansible.builtin.shell: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      args:
        executable: /bin/bash
      when: 
        - install | bool
        - install_rust | bool
        - not rust_installed.stat.exists

    - name: Report Rust status
      ansible.builtin.shell: |
        if [ "{{ install_rust }}" = "true" ]; then
          echo -e "\e[0;32m[✓]\e[0m Rust: rustup, cargo, rustc installed"
        else
          echo -e "\e[1;33m[!]\e[0m Rust: Skipped"
        fi
      args:
        executable: /bin/bash
      changed_when: false

    # ══════════════════════════════════════════
    # CONFIGURE ENVIRONMENT
    # ══════════════════════════════════════════
    - name: Create dev environment additions
      ansible.builtin.copy:
        dest: "{{ ansible_env.HOME }}/Documents/books/.dev-env"
        mode: '0644'
        content: |
          # Development Environment Additions
          # Sourced from .env
          
          # ccache for faster C++ builds
          export PATH="/usr/lib/ccache:$PATH"
          
          # pyenv
          export PYENV_ROOT="$HOME/.pyenv"
          [[ -d $PYENV_ROOT/bin ]] && export PATH="$PYENV_ROOT/bin:$PATH"
          eval "$(pyenv init -)" 2>/dev/null || true
          
          # Rust/Cargo
          [ -f "$HOME/.cargo/env" ] && source "$HOME/.cargo/env"
          
          # Local pip binaries
          export PATH="$HOME/.local/bin:$PATH"
          
          # Useful aliases
          alias py='python3'
          alias ipy='ipython'
          alias venv='python3 -m venv'
          alias activate='source venv/bin/activate'
          alias pytest='python3 -m pytest'
          
          # C++ aliases
          alias cmakeb='cmake -B build -G Ninja'
          alias cmaker='cmake --build build'
          alias cmaker='cmake --build build && ./build/'
      when: install | bool

    - name: Check if .env sources .dev-env
      ansible.builtin.lineinfile:
        path: "{{ ansible_env.HOME }}/Documents/books/.env"
        regexp: 'source.*\.dev-env'
        state: absent
      check_mode: yes
      register: devenv_check
      changed_when: false
      when: install | bool

    - name: Add .dev-env source to .env
      ansible.builtin.lineinfile:
        path: "{{ ansible_env.HOME }}/Documents/books/.env"
        line: |

          # Development environment
          [ -f ~/Documents/books/.dev-env ] && source ~/Documents/books/.dev-env
        insertafter: EOF
      when: 
        - install | bool
        - devenv_check.found == 0

    # ══════════════════════════════════════════
    # SUMMARY
    # ══════════════════════════════════════════
    - name: Print summary
      ansible.builtin.shell: |
        echo -e ""
        echo -e "\e[1m\e[0;36m══════════════════════════════════════════\e[0m"
        echo -e "\e[1m\e[0;36m  Summary\e[0m"
        echo -e "\e[1m\e[0;36m══════════════════════════════════════════\e[0m"
        echo -e ""
        echo -e "\e[1mC++ Development:\e[0m"
        echo -e "  Compilers:    gcc, g++, clang"
        echo -e "  Build:        cmake, ninja, meson, ccache"
        echo -e "  Debug:        gdb, valgrind, strace"
        echo -e "  Libraries:    boost, eigen, gtest"
        echo -e "  LSP:          clangd, clang-tidy"
        echo -e ""
        echo -e "\e[1mPython Development:\e[0m"
        echo -e "  Runtime:      python3, pip, venv, pyenv"
        echo -e "  Linting:      ruff, black, mypy, isort"
        echo -e "  Testing:      pytest, pytest-cov"
        echo -e "  REPL:         ipython, jupyter"
        echo -e "  LSP:          python-lsp-server"
        echo -e ""
        echo -e "\e[1mML/AI Stack:\e[0m"
        echo -e "  Core:         numpy, scipy, pandas, matplotlib"
        echo -e "  ML:           scikit-learn, xgboost, lightgbm"
        echo -e "  DL:           pytorch (CPU version)"
        echo -e "  Notebook:     jupyter, jupyterlab"
        echo -e ""
        echo -e "\e[1mOptional (use -e flag to enable):\e[0m"
        echo -e "  Docker:       {{ 'Installed' if install_docker | bool else 'Skipped (-e install_docker=true)' }}"
        echo -e "  Rust:         {{ 'Installed' if install_rust | bool else 'Skipped (-e install_rust=true)' }}"
        echo -e ""
        if [ "{{ install }}" = "false" ]; then
          echo -e "\e[1;33mTo install, run:\e[0m"
          echo -e "  \e[0;36map code.books/setup-dev-env.yml -e install=true\e[0m"
          echo -e ""
          echo -e "\e[1;33mWith all options:\e[0m"
          echo -e "  \e[0;36map code.books/setup-dev-env.yml -e install=true -e install_docker=true -e install_rust=true\e[0m"
          echo -e ""
        else
          echo -e "\e[1;32mInstallation complete!\e[0m"
          echo -e ""
          echo -e "\e[1mNext steps:\e[0m"
          echo -e "  1. Reload shell:  \e[0;36msource ~/.bashrc\e[0m"
          echo -e "  2. Test Python:   \e[0;36mpython3 --version && pip --version\e[0m"
          echo -e "  3. Test C++:      \e[0;36mgcc --version && cmake --version\e[0m"
          echo -e "  4. Test PyTorch:  \e[0;36mpython3 -c \"import torch; print(torch.__version__)\"\e[0m"
          echo -e ""
          echo -e "\e[1mFor GPU PyTorch:\e[0m"
          echo -e "  pip install torch torchvision --index-url https://download.pytorch.org/whl/cu118"
          echo -e ""
        fi
      args:
        executable: /bin/bash
      changed_when: false
