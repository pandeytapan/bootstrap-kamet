---
#
# Boot Configuration Playbook
# Manages dual-boot (Windows + Pop!_OS), kernel entries, and boot settings
#
# Usage:
#   ansible-playbook conf.books/setup-boot.yml                    # Check current config
#   ansible-playbook conf.books/setup-boot.yml -e configure=true  # Apply configuration
#   ansible-playbook conf.books/setup-boot.yml -e configure=true -e timeout=5  # Set timeout
#
# Options:
#   -e configure=true      Apply boot configuration
#   -e timeout=5           Boot menu timeout in seconds (default: 5)
#   -e default_os=pop      Default OS: 'pop' or 'windows'
#   -e add_windows=true    Add Windows to boot menu
#   -e cleanup=true        Remove old kernel entries
#

- name: Boot Configuration
  hosts: localhost
  connection: local
  gather_facts: yes

  vars:
    configure: false
    timeout: 5
    default_os: "pop"
    add_windows: true
    cleanup: false
    
    # EFI paths
    efi_path: "/boot/efi"
    loader_path: "/boot/efi/loader"
    entries_path: "/boot/efi/loader/entries"
    
    # Windows EFI (common locations)
    windows_efi_partitions:
      - "/dev/sdb1"
      - "/dev/sda1"
      - "/dev/nvme0n1p1"

  tasks:
    # ══════════════════════════════════════════
    # HEADER
    # ══════════════════════════════════════════
    - name: Print header
      ansible.builtin.shell: |
        echo -e "\n\e[1m\e[0;36m══════════════════════════════════════════\e[0m"
        echo -e "\e[1m\e[0;36m  Boot Configuration\e[0m"
        echo -e "\e[1m\e[0;36m══════════════════════════════════════════\e[0m\n"
        if [ "{{ configure }}" = "false" ]; then
          echo -e "\e[1;33m[!] CHECK MODE - No changes will be made\e[0m"
          echo -e "\e[1;33m    Run with: -e configure=true to apply\e[0m\n"
        fi
      args:
        executable: /bin/bash
      changed_when: false

    # ══════════════════════════════════════════
    # STEP 1: GATHER CURRENT STATE
    # ══════════════════════════════════════════
    - name: Step 1 - Gather current boot state
      ansible.builtin.shell: |
        echo -e "\e[0;34m[→]\e[0m \e[1mSTEP 1/5:\e[0m Gathering current boot configuration..."
      args:
        executable: /bin/bash
      changed_when: false

    - name: Get current kernel
      ansible.builtin.command: uname -r
      register: current_kernel
      changed_when: false

    - name: List boot entries
      ansible.builtin.shell: |
        sudo ls {{ entries_path }}/ 2>/dev/null || echo "NO_ENTRIES"
      register: boot_entries
      changed_when: false

    - name: Get current loader.conf
      ansible.builtin.shell: |
        sudo cat {{ loader_path }}/loader.conf 2>/dev/null || echo "NO_CONFIG"
      register: loader_conf
      changed_when: false

    - name: Check for Windows EFI
      ansible.builtin.shell: |
        sudo ls {{ efi_path }}/EFI/Microsoft/Boot/bootmgfw.efi 2>/dev/null && echo "FOUND" || echo "NOT_FOUND"
      register: windows_local
      changed_when: false

    - name: Report current state
      ansible.builtin.shell: |
        echo -e "\e[1m┌─ Current Boot Configuration ────────────┐\e[0m"
        echo -e "\e[0;32m  Kernel:\e[0m       {{ current_kernel.stdout }}"
        echo -e "\e[0;32m  Boot entries:\e[0m"
        for entry in {{ boot_entries.stdout }}; do
          echo -e "    - $entry"
        done
        echo -e "\e[0;32m  Windows EFI:\e[0m  {{ 'Found locally' if windows_local.stdout == 'FOUND' else 'Not in main EFI' }}"
        echo -e "\e[1m└──────────────────────────────────────────┘\e[0m\n"
      args:
        executable: /bin/bash
      changed_when: false

    # ══════════════════════════════════════════
    # STEP 2: FIND WINDOWS
    # ══════════════════════════════════════════
    - name: Step 2 - Find Windows bootloader
      ansible.builtin.shell: |
        echo -e "\e[0;34m[→]\e[0m \e[1mSTEP 2/5:\e[0m Searching for Windows bootloader..."
      args:
        executable: /bin/bash
      changed_when: false
      when: add_windows | bool

    - name: Find Windows EFI partition
      ansible.builtin.shell: |
        for part in {{ windows_efi_partitions | join(' ') }}; do
          if sudo blkid "$part" 2>/dev/null | grep -qi "vfat\|fat32"; then
            sudo mkdir -p /mnt/win-efi-check
            sudo mount "$part" /mnt/win-efi-check 2>/dev/null || continue
            if [ -f "/mnt/win-efi-check/EFI/Microsoft/Boot/bootmgfw.efi" ]; then
              echo "$part"
              sudo umount /mnt/win-efi-check
              exit 0
            fi
            sudo umount /mnt/win-efi-check 2>/dev/null || true
          fi
        done
        echo "NOT_FOUND"
      register: windows_partition
      changed_when: false
      when: 
        - add_windows | bool
        - windows_local.stdout != "FOUND"

    - name: Report Windows search
      ansible.builtin.shell: |
        if [ "{{ windows_local.stdout }}" = "FOUND" ]; then
          echo -e "\e[0;32m[✓]\e[0m Windows bootloader found in main EFI"
        elif [ "{{ windows_partition.stdout | default('NOT_FOUND') }}" != "NOT_FOUND" ]; then
          echo -e "\e[0;32m[✓]\e[0m Windows bootloader found on {{ windows_partition.stdout | default('N/A') }}"
        else
          echo -e "\e[1;33m[!]\e[0m Windows bootloader not found"
        fi
      args:
        executable: /bin/bash
      changed_when: false
      when: add_windows | bool

    # ══════════════════════════════════════════
    # STEP 3: COPY WINDOWS BOOTLOADER
    # ══════════════════════════════════════════
    - name: Step 3 - Configure Windows boot
      ansible.builtin.shell: |
        echo -e "\e[0;34m[→]\e[0m \e[1mSTEP 3/5:\e[0m Configuring Windows boot entry..."
      args:
        executable: /bin/bash
      changed_when: false
      when: add_windows | bool

    - name: Copy Windows bootloader to main EFI
      ansible.builtin.shell: |
        sudo mkdir -p /mnt/win-efi
        sudo mount {{ windows_partition.stdout }} /mnt/win-efi
        sudo cp -r /mnt/win-efi/EFI/Microsoft {{ efi_path }}/EFI/
        sudo umount /mnt/win-efi
      when:
        - configure | bool
        - add_windows | bool
        - windows_local.stdout != "FOUND"
        - windows_partition.stdout | default('NOT_FOUND') != "NOT_FOUND"

    - name: Create Windows boot entry
      ansible.builtin.copy:
        dest: "{{ entries_path }}/Windows.conf"
        mode: '0755'
        content: |
          title   Windows
          efi     /EFI/Microsoft/Boot/bootmgfw.efi
      become: yes
      when:
        - configure | bool
        - add_windows | bool

    - name: Report Windows configuration
      ansible.builtin.shell: |
        if [ "{{ configure }}" = "true" ]; then
          echo -e "\e[0;32m[✓]\e[0m Windows boot entry created"
        else
          echo -e "\e[1;33m[!]\e[0m Windows entry would be created (dry run)"
        fi
      args:
        executable: /bin/bash
      changed_when: false
      when: add_windows | bool

    # ══════════════════════════════════════════
    # STEP 4: CONFIGURE LOADER
    # ══════════════════════════════════════════
    - name: Step 4 - Configure boot loader
      ansible.builtin.shell: |
        echo -e "\e[0;34m[→]\e[0m \e[1mSTEP 4/5:\e[0m Configuring boot loader settings..."
      args:
        executable: /bin/bash
      changed_when: false

    - name: Set default entry name
      ansible.builtin.set_fact:
        default_entry: "{{ 'Pop_OS-current.conf' if default_os == 'pop' else 'Windows.conf' }}"

    - name: Configure loader.conf
      ansible.builtin.copy:
        dest: "{{ loader_path }}/loader.conf"
        mode: '0755'
        content: |
          default {{ default_entry }}
          timeout {{ timeout }}
      become: yes
      when: configure | bool

    - name: Report loader configuration
      ansible.builtin.shell: |
        echo -e "\e[0;32m[✓]\e[0m Loader configured:"
        echo -e "    Default: {{ default_entry }}"
        echo -e "    Timeout: {{ timeout }} seconds"
      args:
        executable: /bin/bash
      changed_when: false

    # ══════════════════════════════════════════
    # STEP 5: CLEANUP OLD KERNELS (Optional)
    # ══════════════════════════════════════════
    - name: Step 5 - Cleanup old entries
      ansible.builtin.shell: |
        if [ "{{ cleanup }}" = "true" ]; then
          echo -e "\e[0;34m[→]\e[0m \e[1mSTEP 5/5:\e[0m Cleaning up old kernel entries..."
        else
          echo -e "\e[0;34m[→]\e[0m \e[1mSTEP 5/5:\e[0m Skipping cleanup (use -e cleanup=true)"
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Remove oldkern entry if exists
      ansible.builtin.file:
        path: "{{ entries_path }}/Pop_OS-oldkern.conf"
        state: absent
      become: yes
      when:
        - configure | bool
        - cleanup | bool

    - name: Update kernelstub to current kernel
      ansible.builtin.shell: |
        sudo kernelstub -k /boot/vmlinuz-{{ current_kernel.stdout }} -i /boot/initrd.img-{{ current_kernel.stdout }}
      when:
        - configure | bool
        - cleanup | bool

    # ══════════════════════════════════════════
    # SUMMARY
    # ══════════════════════════════════════════
    - name: Print summary
      ansible.builtin.shell: |
        echo -e ""
        echo -e "\e[1m\e[0;36m══════════════════════════════════════════\e[0m"
        echo -e "\e[1m\e[0;36m  Boot Configuration Summary\e[0m"
        echo -e "\e[1m\e[0;36m══════════════════════════════════════════\e[0m"
        echo -e ""
        echo -e "\e[1mBoot Menu:\e[0m"
        echo -e "  Default:  {{ default_entry }}"
        echo -e "  Timeout:  {{ timeout }} seconds"
        echo -e ""
        echo -e "\e[1mEntries:\e[0m"
        sudo ls {{ entries_path }}/ | while read entry; do
          echo -e "  - $entry"
        done
        echo -e ""
        if [ "{{ configure }}" = "false" ]; then
          echo -e "\e[1;33mTo apply configuration:\e[0m"
          echo -e "  \e[0;36map conf.books/setup-boot.yml -e configure=true\e[0m"
          echo -e ""
          echo -e "\e[1;33mWith options:\e[0m"
          echo -e "  \e[0;36m-e timeout=10\e[0m         # Set menu timeout"
          echo -e "  \e[0;36m-e default_os=windows\e[0m # Boot Windows by default"
          echo -e "  \e[0;36m-e cleanup=true\e[0m       # Remove old kernel entries"
        else
          echo -e "\e[1;32mConfiguration applied!\e[0m"
          echo -e ""
          echo -e "Reboot to see the new boot menu."
        fi
        echo -e ""
      args:
        executable: /bin/bash
      changed_when: false
